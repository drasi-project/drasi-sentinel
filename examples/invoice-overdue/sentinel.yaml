agent:
  url: { env: AZURE_OPENAI_ENDPOINT }
  model: { env: AZURE_OPENAI_MODEL }
plugins:
  - ref: source/postgres
  - ref: bootstrap/postgres
  - ref: secret-store/file
secretStore:
  kind: file
  path: secrets/secrets.json
service:
  profile: production
  a2a:
    authentication:
      mode: jwt
      issuer: https://issuer.example.test/
      audience: drasi-sentinel
      public_key:
        kind: Secret
        name: a2a-public-key
sources:
  - id: invoices
    kind: postgres
    config:
      host: 127.0.0.1
      port:
        kind: Secret
        name: postgres-cdc-port
      database: sentinel
      user: sentinel_cdc
      password:
        kind: Secret
        name: postgres-cdc-password
      tables: [invoices]
      slotName: drasi_invoice_slot
      publicationName: drasi_invoice_publication
      sslMode: disable
      tableKeys:
        - table: invoices
          keyColumns: [id]
    bootstrap:
      kind: postgres
      host: 127.0.0.1
      port:
        kind: Secret
        name: postgres-cdc-port
      database: sentinel
      user: sentinel_cdc
      password:
        kind: Secret
        name: postgres-cdc-password
      tables: [invoices]
      slotName: drasi_invoice_slot
      publicationName: drasi_invoice_publication
      sslMode: disable
      tableKeys:
        - table: invoices
          keyColumns: [id]
queries:
  - id: overdue-invoices
    description: Finds open invoices whose due date has passed.
    examples:
      - Tell me when an invoice is overdue.
    cypher: >-
      MATCH (invoice:Invoice)
      WHERE invoice.status = 'open' AND invoice.due_date < datetime()
      RETURN invoice.id AS invoice_id,
             invoice.account_id AS account_id,
             invoice.due_date AS due_date
    sources: [invoices]
    reactions: [notify-account]
reactions:
  - id: notify-account

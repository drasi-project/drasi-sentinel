# Site configuration for the Drasi Sentinel documentation site.
#
# This mirrors the Drasi .NET library site (Hugo + Docsy). It is published to
# GitHub Pages by .github/workflows/website.yml.

# The Actions workflow overrides this with the Pages base URL.
baseURL = "https://drasi-project.github.io/drasi-sentinel/"
title = "Drasi Sentinel Docs"
theme = "docsy"

author = "Copyright © contributors to Drasi, established as Drasi a Series of LF Projects, LLC"
copyright = """Copyright&nbsp;©&nbsp;Drasi&nbsp;a&nbsp;Series&nbsp;of&nbsp;LF&nbsp;Projects,&nbsp;LLC. For&nbsp;website&nbsp;terms&nbsp;of&nbsp;use,&nbsp;trademark&nbsp;policy&nbsp;and&nbsp;other&nbsp;project&nbsp;policies&nbsp;please&nbsp;see&nbsp;<a href="https://lfprojects.org/policies/">lfprojects.org/policies/</a>."""

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    weight = 1

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true

[[menu.main]]
    name = "GitHub"
    weight = 10
    url = "https://github.com/drasi-project/drasi-sentinel"
    pre = "<i class='fab fa-github'></i>"
[[menu.main]]
    name = "Drasi.io"
    weight = 20
    url = "https://drasi.io"
    pre = "<i class='fas fa-external-link-alt'></i>"
[[menu.main]]
    name = "Discord"
    weight = 30
    url = "https://aka.ms/drasidiscord"
    pre = "<i class='fab fa-discord'></i>"

[module]
  [module.hugoVersion]
    extended = true
    min = "0.152.2"

[params]
  offlineSearch = true
  offlineSearchMaxResults = 10

  github_repo = "https://github.com/drasi-project/drasi-sentinel"
  github_branch = "main"
  github_subdir = "website"

  version = "0.1.0-alpha.1"

[params.ui]
  sidebar_menu_compact = false
  sidebar_search_disable = false
  sidebar_menu_foldable = true
  sidebar_menu_truncate = 100
  ul_show = 1
  navbar_logo = true
  showLightDarkModeMenu = true
  [params.ui.readingtime]
    enable = true

[params.ui.feedback]
  enable = true
  yes = 'Glad to hear it! Please <a href="https://github.com/drasi-project/drasi-sentinel/issues/new">tell us how we can improve</a>.'
  no = 'Sorry to hear that. Please <a href="https://github.com/drasi-project/drasi-sentinel/issues/new">tell us how we can improve</a>.'

[[params.links.user]]
  name = "Drasi.io"
  url = "https://drasi.io"
  icon = "fas fa-external-link-alt"
  desc = "The Drasi project"
[[params.links.developer]]
  name = "GitHub"
  url = "https://github.com/drasi-project/drasi-sentinel"
  icon = "fab fa-github"
  desc = "Source, issues, and contributions"
[[params.links.developer]]
  name = "Discord"
  url = "https://aka.ms/drasidiscord"
  icon = "fab fa-discord"
  desc = "Chat with the Drasi community"

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]
